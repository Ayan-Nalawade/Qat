<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Settings</title>
<link rel="stylesheet" href="qat://settings/shared/style.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div id="page">
  <main>
    <h1>Settings</h1>
    <h2 class="sec">Privacy</h2>
    <section class="card glass">
      <label class="sw"><span><b>Deep scan</b><small>Blocks ads that come from the site itself, like YouTube video ads, plus cookie banners and tracker hosts the normal lists miss. Uses about 15 MB more memory. Open tabs pick it up after a reload.</small></span><input id="deep" type="checkbox"></label>
      <span class="note" id="deep-note"></span>
    </section>
    <h2 class="sec">AI</h2>
    <section class="card glass">
      <label>Active provider<select id="active" class="ctl"></select></label>
    </section>
    <div id="cards"></div>
  </main>
</div>
<script src="qat://settings/shared/picker.js"></script>
<script src="settings.js"></script>
</body>
</html>

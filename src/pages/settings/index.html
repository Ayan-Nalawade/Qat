<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Settings</title>
<link rel="icon" href="qat://settings/shared/icon.png">
<link rel="stylesheet" href="qat://settings/shared/style.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<nav>
  <div class="brand"><img src="qat://settings/shared/icon.png" alt=""><span>Qat</span></div>
  <a href="qat://settings" class="on">Settings</a>
  <a href="qat://history">History<kbd>Ctrl+H</kbd></a>
  <a href="qat://bookmarks">Bookmarks</a>
  <a href="qat://extensions">Extensions</a>
</nav>
<main>
  <h2>Settings</h2>
  <div class="box">
    <div class="hd">Browsing</div>
    <label class="item">
      <span class="txt"><b>Deep scan</b><small>Bigger block lists for ads the normal ones miss. About 20 MB more RAM.</small><small class="note" id="deep-note"></small></span>
      <input id="deep" class="sw" type="checkbox">
    </label>
    <label class="item">
      <span class="txt"><b>Scam check</b><small>Your AI looks at sites Qat doesn't know and flags scams. Needs an AI key.</small></span>
      <input id="scam" class="sw" type="checkbox">
    </label>
  </div>
  <div class="box">
    <div class="hd">AI</div>
    <label class="item">
      <span class="txt"><b>Provider</b></span>
      <select id="active" class="ctl"></select>
    </label>
    <div id="cards"></div>
  </div>
  <div class="box">
    <div class="hd">Qat</div>
    <div class="item">
      <span class="txt"><b>Version</b><small id="ver"></small></span>
    </div>
    <div class="item">
      <span class="txt"><b>Reset Qat</b><small>Wipes everything and restarts.</small></span>
      <button type="button" class="pill danger" id="reset-btn">Reset</button>
    </div>
  </div>
</main>
<script src="qat://settings/shared/picker.js"></script>
<script src="settings.js"></script>
</body>
</html>

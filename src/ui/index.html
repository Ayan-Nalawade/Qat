<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'">
<title>Qat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" class="btn" title="New tab (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div id="drag"></div>
      <div id="winctl">
        <button id="w-min" title="Minimize"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button id="w-max" title="Maximize"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button id="w-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div id="toolbar" class="glass">
      <button id="back" class="btn" title="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="forward" class="btn" title="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="reload" class="btn" title="Reload"><svg class="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg><svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <input id="omnibox" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
      <button id="mem" title="Memory used by Qat. Click to sleep background tabs"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="10" rx="2"/><path d="M9 7V4M15 7V4M9 20v-3M15 20v-3"/></svg><span id="mem-val">0 MB</span></button>
      <button id="ai-toggle" class="btn" title="Assistant"><span>AI</span></button>
      <div id="loadbar"></div>
    </div>
  </header>
  <main id="main">
    <div id="viewport"></div>
    <aside id="side" class="glass">
      <div id="chat-head">
        <h2>Assistant</h2>
        <span id="chat-prov"></span>
        <button id="chat-new" class="btn" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button id="chat-set" class="btn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div id="chat-msgs"></div>
      <form id="chat-cfg" hidden>
        <label>Provider<select id="cfg-prov"></select></label>
        <label>Base URL<input id="cfg-base" type="text" spellcheck="false" autocomplete="off"></label>
        <label>Model<input id="cfg-model" type="text" list="cfg-models" spellcheck="false" autocomplete="off"></label>
        <datalist id="cfg-models"></datalist>
        <button type="button" id="cfg-load" class="link">Load models</button>
        <label>API key<input id="cfg-key" type="password" autocomplete="off"></label>
        <button type="button" id="cfg-clear" class="link">Clear key</button>
        <div id="cfg-note"></div>
        <button type="submit" id="cfg-save">Save</button>
      </form>
      <div id="chat-composer">
        <textarea id="chat-in" rows="1" placeholder="Message" spellcheck="false"></textarea>
        <button id="chat-send" class="btn" title="Send"><svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="i-halt" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
      </div>
    </aside>
  </main>
</div>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>

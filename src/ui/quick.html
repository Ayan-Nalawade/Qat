<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http: qat:; style-src 'self' 'unsafe-inline'">
<title>Quick ask</title>
<link rel="stylesheet" href="quick.css">
</head>
<body data-veil="0" data-lock="dark" data-tone="dark">
<div class="v"></div>
<div class="r"><i></i></div>
<main id="q">
  <section id="card" class="lg" hidden>
    <div id="ans-q"></div>
    <div id="ans-scroll" data-clip><div id="ans-body"></div></div>
    <footer id="ans-act">
      <button id="copy" class="act"><span>Copy</span></button>
      <button id="move" class="act">Continue in assistant</button>
      <button id="fresh" class="act">New question</button>
    </footer>
  </section>
  <form id="pill" class="lg">
    <i class="o"></i>
    <div class="x"><small id="meta">Quick ask</small><input id="q-in" type="text" autocomplete="off" spellcheck="false" placeholder="Ask or tell Qat what to do"></div>
    <button type="button" id="mode" title="Browser control (Tab)"><svg viewBox="0 0 22 22"><path d="M3 2v16.6l4.6-4.3 3 6.8 2.9-1.2-3-6.7h6.4z"/></svg></button>
    <i class="sep"></i>
    <button id="go"><i></i><span>Ask</span></button>
  </form>
</main>
<script src="md.js"></script>
<script src="quick.js"></script>
<script src="glass.js"></script>
</body>
</html>
